{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'tmnt.css' %}">
    <link rel="icon" href="{% static 'favicon.ico' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>{% block title %}Base{% endblock %}</title>
</head>
<body>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <!-- Top of screen menu bar -->
    <div id = "menuBar">
        <h1>Threat Modeling Naturally Tool</h1>
        <div class="topnav">
            {% if user.is_authenticated %}
            <a href="#" class="logout-button" style="background-color: #dc3545" data-bs-toggle="modal" data-bs-target="#logoutModal" role="button">Log Out</a>
            <a href="{% url 'view_projects' %}">Profile</a>
            {% else %}
                <a href="{%  url 'login' %}">Login</a>
            {% endif %}
            <a href="#share">Share</a>
    {#        <a href="#export">Export</a>#}
        </div>
    </div>
    {% block content %}
    {% endblock %}
</body>
</html>
