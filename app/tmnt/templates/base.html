{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intro.js/minified/introjs.min.css">
    <script src="https://cdn.jsdelivr.net/npm/intro.js/minified/intro.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" href="{% static 'favicon.ico' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<!-- Bootstrap Font Icon CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{% static 'tmnt.css' %}">
    <title>{% block title %}Base{% endblock %}</title>
</head>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const shareBtn = document.getElementById("share-btn");
        if (!shareBtn) return;
    
        shareBtn.addEventListener("click", function (e) {
            e.preventDefault();
    
            fetch("{% url 'reset_tutorial' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}"
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to reset tutorial");
                }
                // Redirect to projects where onboarding will auto-start 
                window.location.href = "{% url 'view_projects' %}";
            })
            .catch(err => {
                console.error(err);
                alert("Failed to reset onboarding state");
            });
        });
    });
    </script>
<body>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <!-- Top of screen menu bar -->
    <div id = "menuBar">
        <h1>Threat Modeling Naturally Tool</h1>
        <div class="topnav">
            {% if user.is_authenticated %}
            <a href="#" class="logout-button" style="background-color: #dc3545" data-bs-toggle="modal" data-bs-target="#logoutModal" role="button">Log Out</a>
            <a href="{% url 'view_projects' %}">Profile</a>
            {% else %}
                <a href="{%  url 'login' %}">Login</a>
            {% endif %}
            <a href="#" id="share-btn">Share</a>
    {#        <a href="#export">Export</a>#}
        </div>
    </div>
    {% block content %}
    {% endblock %}
    {% include "registration/logout.html" %}
</body>
</html>
